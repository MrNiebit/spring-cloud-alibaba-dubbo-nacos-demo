# ---------------Dubbo\u8FDC\u7A0B\u8C03\u7528\u76F8\u5173 start -------------------
# \u6307\u5B9A\u8981\u626B\u63CF\u7684\u5305\uFF0CDubbo \u670D\u52A1\u63A5\u53E3\u7684\u5B9E\u73B0\u7C7B\u6240\u5728\u5305
dubbo.scan.base-packages=cn.lacknb.service
# \u914D\u7F6E Dubbo \u534F\u8BAE
dubbo.protocol.name=dubbo
# \u914D\u7F6E Dubbo \u534F\u8BAE\u7684\u7AEF\u53E3\u53F7
dubbo.protocol.port=20880
# \u914D\u7F6E Dubbo \u670D\u52A1\u63D0\u4F9B\u8005\u7ED1\u5B9A\u7684\u4E3B\u673A\u5730\u5740
dubbo.protocol.host=192.168.0.149
# \u4F7F\u7528\u7B80\u5316\u6CE8\u518C\uFF0C\u51CF\u5C11\u6CE8\u518C\u4E2D\u5FC3\u7684\u5143\u6570\u636E\u5B58\u50A8
dubbo.registry.simplified=true
# \u7981\u7528 Dubbo \u7684 QOS\uFF08\u8FD0\u7EF4\uFF09\u670D\u52A1\uFF0C\u9ED8\u8BA4 QOS \u670D\u52A1\u5728 22222 \u7AEF\u53E3\u542F\u52A8
dubbo.application.qos-enable=false
# \u6307\u5B9A Nacos \u4F5C\u4E3A\u6CE8\u518C\u4E2D\u5FC3
dubbo.registry.address=nacos://${nacos.ip-address}:${nacos.port}
# \u6CE8\u518C\u4E2D\u5FC3 Nacos \u7684\u7528\u6237\u540D
dubbo.registry.username=${nacos.username}
# \u6CE8\u518C\u4E2D\u5FC3 Nacos \u7684\u5BC6\u7801
dubbo.registry.password=${nacos.password}
# \u5728\u591A\u4E2A\u6CE8\u518C\u4E2D\u5FC3\u4E2D\u8BBE\u7F6E Nacos \u4E3A\u4F18\u5148\u4F7F\u7528\u7684\u6CE8\u518C\u4E2D\u5FC3
dubbo.registry.preferred=true
# \u6CE8\u518C\u4E2D\u5FC3\u7684\u7248\u672C\u53F7\uFF0C\u4FBF\u4E8E\u591A\u7248\u672C\u7BA1\u7406
dubbo.registry.version=1.0.0
# ---------------Dubbo\u8FDC\u7A0B\u8C03\u7528\u76F8\u5173 end -------------------


# ---------------\u670D\u52A1\u6CE8\u518C\u53D1\u73B0\u76F8\u5173 start -------------------
# \u914D\u7F6E\u5E94\u7528\u7A0B\u5E8F\u4F18\u5148\u4F7F\u7528\u7684\u7F51\u7EDC\uFF08\u8FD9\u91CC\u9650\u5236\u4E3A\u5C40\u57DF\u7F51 192.168.0 \u6BB5\uFF09
spring.cloud.inetutils.preferred-networks=192.168.0
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u670D\u52A1\u5668\u5730\u5740
spring.cloud.nacos.discovery.server-addr=${nacos.ip-address}:${nacos.port}
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u7528\u6237\u540D
spring.cloud.nacos.discovery.username=${nacos.username}
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u5BC6\u7801
spring.cloud.nacos.discovery.password=${nacos.password}
# ---------------\u670D\u52A1\u6CE8\u518C\u53D1\u73B0\u76F8\u5173 end -------------------

# \u5141\u8BB8\u66B4\u9732\u6240\u6709 Actuator \u7AEF\u70B9\uFF0C\u5982\u73AF\u5883\u4FE1\u606F\uFF08\u751F\u4EA7\u73AF\u5883\u5E94\u8C28\u614E\u5904\u7406\uFF09
management.endpoints.web.exposure.include=env
