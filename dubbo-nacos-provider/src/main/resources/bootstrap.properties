# \u670D\u52A1\u5668\u7AEF\u53E3\u53F7
server.port=8001
# \u5E94\u7528\u7A0B\u5E8F\u540D\u79F0
spring.application.name=dubbo-nacos-provider
# \u5F53\u524D\u6FC0\u6D3B\u7684\u73AF\u5883\u914D\u7F6E\u6587\u4EF6
spring.profiles.active=dev
# Nacos \u670D\u52A1\u5668 IP \u5730\u5740
nacos.ip-address=127.0.0.1
# Nacos \u670D\u52A1\u5668\u7AEF\u53E3\u53F7
nacos.port=8848
# Nacos \u670D\u52A1\u5668\u7684\u7528\u6237\u540D
nacos.username=nacos
# Nacos \u670D\u52A1\u5668\u7684\u5BC6\u7801
nacos.password=nacos

# ---------------\u8FDC\u7A0B\u52A8\u6001\u914D\u7F6E\u76F8\u5173 start -------------------
# Nacos \u914D\u7F6E\u4E2D\u5FC3\u7684\u670D\u52A1\u5668\u5730\u5740
spring.cloud.nacos.config.server-addr=${nacos.ip-address}:${nacos.port}
# Nacos \u914D\u7F6E\u4E2D\u5FC3\u7684\u7528\u6237\u540D
spring.cloud.nacos.config.username=${nacos.username}
# Nacos \u914D\u7F6E\u4E2D\u5FC3\u7684\u5BC6\u7801
spring.cloud.nacos.config.password=${nacos.password}
# \u914D\u7F6E\u6587\u4EF6\u7684\u683C\u5F0F\uFF0C\u8BBE\u7F6E\u4E3A yaml
spring.cloud.nacos.config.file-extension=yaml
# \u547D\u540D\u7A7A\u95F4 ID \u5BF9\u5E94 Nacos \u4E2D\u7684\u547D\u540D\u7A7A\u95F4
spring.cloud.nacos.config.namespace=devops
# \u914D\u7F6E\u6587\u4EF6\u6240\u5728\u7684\u5206\u7EC4
spring.cloud.nacos.config.group=devops
# \u9ED8\u8BA4 dataId \u4E3A spring.application.name
# spring.cloud.nacos.config.name=${spring.application.name}
# \u52A0\u8F7D\u6269\u5C55\u914D\u7F6E\u6587\u4EF6 application-preview.yml
spring.cloud.nacos.config.extension-configs[0].data-id=application-preview.yml
# \u914D\u7F6E\u6587\u4EF6\u6240\u5C5E\u7684\u5206\u7EC4
spring.cloud.nacos.config.extension-configs[0].group=devops
# \u662F\u5426\u5F00\u542F\u52A8\u6001\u5237\u65B0
spring.cloud.nacos.config.extension-configs[0].refresh=true
# \u52A0\u8F7D\u6269\u5C55\u914D\u7F6E\u6587\u4EF6 application-after.yml
spring.cloud.nacos.config.extension-configs[1].data-id=application-after.yml
# \u914D\u7F6E\u6587\u4EF6\u6240\u5C5E\u7684\u5206\u7EC4
spring.cloud.nacos.config.extension-configs[1].group=devops
# \u662F\u5426\u5F00\u542F\u52A8\u6001\u5237\u65B0
spring.cloud.nacos.config.extension-configs[1].refresh=true
# ---------------\u8FDC\u7A0B\u52A8\u6001\u914D\u7F6E\u76F8\u5173 end -------------------
