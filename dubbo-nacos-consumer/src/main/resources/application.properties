# \u670D\u52A1\u5668\u7AEF\u53E3\u53F7
server.port=8002
# \u5E94\u7528\u7A0B\u5E8F\u540D\u79F0
spring.application.name=dubbo-nacos-consumer

# Nacos \u6CE8\u518C\u4E2D\u5FC3\u5730\u5740
dubbo.registry.address=nacos://127.0.0.1:8848
# Nacos \u6CE8\u518C\u4E2D\u5FC3\u7AEF\u53E3
dubbo.registry.port=8848
# Nacos \u6CE8\u518C\u4E2D\u5FC3\u7684\u7528\u6237\u540D
dubbo.registry.username=nacos
# Nacos \u6CE8\u518C\u4E2D\u5FC3\u7684\u5BC6\u7801
dubbo.registry.password=nacos
# \u6CE8\u518C\u4E2D\u5FC3\u7684\u7248\u672C\u53F7
dubbo.registry.version=1.0.0
# Dubbo \u534F\u8BAE\u7684\u7AEF\u53E3\uFF0C\u6D88\u8D39\u8005\u4E0D\u9700\u8981\u6307\u5B9A\u7AEF\u53E3\uFF0C\u6240\u4EE5\u8BBE\u7F6E\u4E3A -1
dubbo.protocol.port=-1
# \u6D88\u8D39\u8005\u4E0D\u9700\u8981\u7ED1\u5B9A IP \u5730\u5740\uFF0C\u6CE8\u91CA\u6389\u7ED1\u5B9A IP \u7684\u914D\u7F6E
# dubbo.protocol.host=192.168.1.108
# \u8BBE\u7F6E\u4E3A\u9996\u9009\u7684\u6CE8\u518C\u4E2D\u5FC3
dubbo.registry.preferred=true
# \u7981\u7528 Dubbo \u7684 QOS\uFF08\u8FD0\u7EF4\uFF09\u670D\u52A1\uFF0C\u9ED8\u8BA4 QOS \u670D\u52A1\u5728 22222 \u7AEF\u53E3\u542F\u52A8
dubbo.application.qos-enable=false

# \u4F18\u5148\u4F7F\u7528\u7684\u7F51\u7EDC\uFF08192.168.0 \u6BB5\u7684\u7F51\u7EDC\uFF09
spring.cloud.inetutils.preferred-networks=192.168.0
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u670D\u52A1\u5668\u5730\u5740
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u7528\u6237\u540D
spring.cloud.nacos.discovery.username=nacos
# Nacos \u670D\u52A1\u53D1\u73B0\u7684\u5BC6\u7801
spring.cloud.nacos.discovery.password=nacos
